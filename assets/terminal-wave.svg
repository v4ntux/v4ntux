<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B10" />
      <stop offset="0.55" stop-color="#0D1117" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="neon" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#39D9A2;#A855F7;#22D3EE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.5" stop-color="#39D9A2">
        <animate attributeName="stop-color" values="#39D9A2;#A855F7;#22D3EE;#39D9A2" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#A855F7">
